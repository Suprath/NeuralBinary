version: '3.8'

services:
  neural_binary_db:
    image: timescale/timescaledb:latest-pg15
    container_name: neural_binary_postgres
    restart: always
    environment:
      POSTGRES_DB: neural_binary
      POSTGRES_USER: neural_user
      POSTGRES_PASSWORD: neural_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
